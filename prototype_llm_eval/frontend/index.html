<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Evaluation Prototype</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <h1>LLM Evaluation Prototype</h1>

    <section class="panel">
      <h2>1) Generate Task</h2>
      <label for="concept">Concept</label>
      <select id="concept">
        <option value="loops">loops</option>
        <option value="conditions">conditions</option>
        <option value="lists">lists</option>
        <option value="functions">functions</option>
      </select>

      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="beginner">beginner</option>
        <option value="intermediate">intermediate</option>
      </select>

      <button id="generateTaskBtn">Generate Task</button>
      <pre id="taskOutput"></pre>
    </section>

    <section class="panel">
      <h2>2) Mark Answer</h2>
      <label for="studentAnswer">Student Answer</label>
      <textarea id="studentAnswer" rows="8" placeholder="Paste or type the student answer here..."></textarea>
      <button id="markAnswerBtn">Mark Answer</button>
      <pre id="markOutput"></pre>
    </section>

    <section class="panel">
      <h2>3) Generate Feedback</h2>
      <button id="feedbackBtn">Generate Feedback</button>
      <pre id="feedbackOutput"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
